tier1_discovery: "The structure does not conform to natural formation. The angles are deliberate. Stone does not arrange itself into corridors without intention. Someone built this and the ocean accepted it."
tier2_market: "The stalls are empty now but the arrangement remains. Goods were exchanged here in volume — the wear patterns in the stone suggest decades of trade, not seasons. This was not an outpost. This was a settlement."
tier3_archive: "The inscription system is not one we recognise from surface ruins. The notation is consistent across the walls, which means it was standardised. Someone created a writing system for this place specifically, which means they planned to stay."
tier3_engine: "The Current Engine was not built for power generation in any sense we currently understand. The output is structural — it maintains something, not generates something. The Antecedents built it to preserve a condition, not create one."
tier4_door: "The door is the second lock. The first lock was the descent. Every step that brought you here was a test of a kind the city administers without asking. You passed. The door knew before you did."
archive_intro: "The Archive holds what the surface forgot. The Antecedents did not trust the surface to remember. They were correct."
refugee_lore: "We did not descend. We remained. When the water came, we stayed with what we had built. The surface calls this catastrophe. We call it continuity."
recognition_lore: "Your cartographic record precedes you. The Archive does not grant access. It recognises presence. You were already known here before you arrived."
