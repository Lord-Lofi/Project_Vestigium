ashen_wastes: "The Ashen Wastes are what the End looks like when it has forgotten it ever had a purpose. The stone here is older than the outer islands. It has been here since before the Antecedents arrived. It will be here after everything else has concluded."
verdant_remnant: "The Endermen tend what grows here. We do not know if they understand that the growth is not natural. We do not know if that distinction is meaningful to them. They move through the remnant with the attention of archivists. Something here matters to them."
resonance_fields: "The field produces a resonance that predates the crystal formations visible above ground. The crystals are the output, not the source. Whatever generates the frequency is below the bedrock layer, and we have no instrument that reads it accurately."
the_crucible: "This is the place where the Shattering was recorded, not caused. The Antecedents came to the Crucible after the event to document what had already occurred. The floor here is older than the rest of the island. It was placed deliberately."
petrified_archive: "The Archive is petrified in the geological sense — frozen mid-process. Something interrupted it. The cataloguing was incomplete when whatever happened happened. The Endermen have maintained it in the state they found it. They are not completing it. They are preserving the incompleteness."
mourning_shallows: "The Shallows exist at the boundary where the End stops maintaining itself and simply continues. Below the level of the clouds there is a different quality to the air, if air is the right word. The Endermen do not come here. We do not know if they are avoiding it or have simply never descended."
drifting_islands: "The islands do not drift at a measurable rate. They drift at a rate that is only apparent over geological time. Something about their composition does not adhere to the gravitational rules of the outer ring. The Antecedents theorised that they are anchored to a different point in space than they appear to be."
