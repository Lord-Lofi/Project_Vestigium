tablet_01: "The first time it died, it came back wearing the same shape. The Endermen did not react. They had been waiting."
tablet_02: "Kill it again. It remembers dying. It is learning what you are."
tablet_03: "It does not experience pain the way you would. It experiences it the way memory experiences forgetting — as a kind of pressure."
tablet_04: "The egg persists. Whatever seals itself in there does not leave. The dragon is the door, not the thing behind it."
tablet_05: "The fifth death is the last one the End counts. After this you have simply been here long enough to understand what the Endermen already knew."
