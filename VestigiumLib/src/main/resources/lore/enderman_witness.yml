tablet_01: "They were watching before you arrived. They will be watching after. The End has a long memory and the Endermen are the part that does the remembering."
tablet_02: "You have killed one. It did not frighten them. It told them something about you."
tablet_03: "Ten. They keep a count you can only partially see."
tablet_04: "One stood beside you and did not act. In the End, that is consent."
tablet_05: "They gathered without command. This is what they do at the edges of significant things."
tablet_06: "You have seen what they see. They saw what you understood. The Witness chain is closed."
