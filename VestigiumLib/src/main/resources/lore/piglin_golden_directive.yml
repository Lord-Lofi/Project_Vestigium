tablet_01: "The gold is not wealth to them. We confirmed this after six weeks of observation. They do not use it. They guard it. Every piece recovered from an Antecedent site is carried to a central location and kept. Unworn. Unused. Curated."
tablet_02: "Our linguist believes the Piglin word for gold translates roughly as 'the weight of the dead.' We have not been able to confirm this. The expeditions that got close enough to verify did not file final reports."
tablet_03: "Directive from the Oversight Committee: cease all attempts to trade golden Antecedent artifacts with the Piglins. Whatever agreement existed before the Severance is not ours to renegotiate. Keep the gold. Keep the peace."
