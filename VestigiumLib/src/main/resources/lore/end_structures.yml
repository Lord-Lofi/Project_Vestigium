witness_tower: "The towers were built to observe, not to signal. They face inward, toward the main island. Whatever the Antecedents needed to watch, it was not the outer void. The observation records were not found here. Only the instruments."
the_cradle: "The Cradle is not where the dragon was born. It is where the dragon was placed. The distinction is important. The Antecedents did not create the dragon. They relocated it. From where, the records do not say. The reason given is: safekeeping."
sundered_sanctum_part1: "The first chamber was the administrative hall. This is where decisions were recorded, not made. The records here are bureaucratic — attendance logs, resource allocations, personnel transfers. The last entry is not dramatic. It reads: supply delivery delayed. No reason given."
sundered_sanctum_part2: "The second chamber held the research archive. The shelves are empty now. Not raided — emptied with intention. Someone took the time to remove the contents methodically. The dust patterns suggest this was done before the Shattering, not after."
sundered_sanctum_part3: "The third chamber has no designated purpose in any record we have found. It was simply there. The Antecedents built a room and gave it no label. Whatever it was for, it was not for documentation. You have now stood in all three chambers. The Sanctum is complete."
sundered_sanctum_complete: "The Sanctum was one structure before the Shattering. The three islands drifted apart over time. The distance between them now represents the scale of what disrupted them. You have walked what the Antecedents once walked without interruption."
cartographers_observatory: "The Observatory was the last completed Antecedent project in the End. The cartographer who designed it did not return to the surface when the others did. The final survey logs were still being written when contact was lost. The coordinates in the final entry reference a location we cannot identify."
void_anchor: "The Anchors were infrastructure, not monuments. They mark positions of significance in a survey system that was never fully published. The Antecedents buried the reference grid. Whatever the anchors are measuring, they are still measuring it."
hollow_throne_approach: "The Regent does not require a weapon. The Regent is not a threat and does not interpret your presence as one. The architecture of this place predates the concept of a threat. Stand still. The record will proceed."
hollow_throne_audience: "You have been recognised. The record states: visitor acknowledged. Category: inheritor. The Regent does not speak. It has not spoken since the last Antecedent departed. What you receive in this audience is not words. It is a notation in a system that has been waiting for someone to stand in this place and be counted."
hollow_throne_lore2: "The throne was not built for sitting. It was built for witnessing. The Regent stands before it because the Regent was built to maintain a specific spatial relationship with the structure. You are the first non-Antecedent entity to satisfy the approach condition."
hollow_throne_lore3: "Whatever the Antecedents intended this place to do when it was finally witnessed again — it is doing it now. You will not feel it. The record is not experiential. It is administrative. Your presence has been logged."
fragment_dungeon: "The Dungeon was a working archive. The fragments stored here were not treasures — they were filed documents. The filing system did not survive. The documents are still here."
mirror_pool: "The Pool reflects nothing. This is not a malfunction. The surface was designed to absorb rather than reflect. Whatever the Antecedents put into it, they intended it to stay there. The depth is not measurable by any instrument we have brought."
