tablet_01: "Day 14. The native creatures here do not attack us as they do the others. We have concluded it relates to the gold instruments we carry. Researcher Valdis suggests it is recognition — as if they have seen these tools before."
tablet_02: "Day 22. Overlord (our name for the large one with the tattered banner) has begun approaching the camp at intervals. It does not touch any of our equipment. It waits. We have started leaving small offerings. It takes nothing. It keeps returning."
tablet_03: "Day 31. The Overlord brought three others today. They examined every piece of golden equipment with what I can only describe as reverence. Not hunger — reverence. Whatever these creatures remember, it is older than this expedition."
