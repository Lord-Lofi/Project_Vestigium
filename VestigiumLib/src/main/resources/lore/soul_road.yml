first_steps: "The path is not natural. Stone does not arrange itself into this kind of order. These roads were planned. The materials are precise. Whoever built this knew exactly where they were going."
expedition_log: "Field note, unnumbered. We have been following the road for eleven days. Whatever covenant the Antecedents made with this place, it seems we are permitted to inherit it. The Wither Skeletons leave us alone on the road. We do not ask why. We keep walking."
veteran: "The road does not end at The Breach Point. That is where the road begins to ask questions. Every step I have taken on this pavement has been preparation for an answer I have not yet been asked to give."
breach_point: "It was not built as a door. It was built as a record. The Antecedents came here to write down what they had done, not to do it again. The opening is incidental. The inscription is the point."
expedition_camp_alpha: "Camp Alpha was the third waystation on the primary survey route. Seventeen expedition members logged here over the span of the project. None of them returned on the same road. We do not know what this means."
expedition_camp_beta: "The second camp. We believe this was the forward operating point for the final approach to the Breach. The hearth-fire markers are still legible. Someone took the time to leave directions. They expected others to follow."
