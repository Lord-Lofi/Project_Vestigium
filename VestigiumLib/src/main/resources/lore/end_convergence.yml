tablet_01: "This is the platform. This is where the first ones arrived who did not come by choice. They stood here and looked at the dragon and understood they were the second thing to get this wrong."
tablet_02: "The Shattering did not originate in the End. It was completed here. What was broken elsewhere came here to be acknowledged."
tablet_03: "You are standing where the decision was made. The decision was not to leave."
