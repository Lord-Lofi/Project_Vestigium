# Antecedent Vault — core world lore about the Antecedent and the Conclave schism.
# Primary script: Antecedent. A Resonant field note is also present on the vault wall.

main: |
  SEALED VAULT — Conclave Internal Record
  [Antecedent script detected. A resonant field note is also present.]

antecedent: |
  SEALED VAULT — Conclave Internal Record

  The Antecedent was not a person. It was a condition — a state of the
  world before the omen became a discrete force. When the first cataclysm
  occurred, the omen separated from the land like a shadow from a body.

  The Cultists believe they can restore the Antecedent state.
  They are correct that it was once whole.
  They are wrong about what returning to it would mean.

  Do not show this to anyone who uses the word "restoration"
  without hesitation.

resonant: |
  RESONANT FIELD NOTE — Vault Site Survey

  The vault substrate is sculk. Not applied. Grown here.
  The sculk predates the vault structure itself by an unknown margin —
  our instruments cannot date growth this old.

  Whatever was sealed here was sealed by something that understood
  the sculk's purpose before we had a name for it.
  We do not yet understand it ourselves.

  The vault did not require a lock. The sculk was the lock.
  — RS Field Note 7, Survey Year 6
