# Vestigium NPC Custom Skins — Villager entities
# OptiFine Random Entities: matches on vestigium PDC tags (BukkitValues NBT).
# Non-matching villagers (vanilla) are unaffected.
#
# Texture format: 64×64 PNG, Villager UV layout.
# All NPCs use Villager.Profession.NONE — see NPC_SKINS_NEEDED.txt for the
# unemployed overlay options available to artists.
#
# NBT path: nbt.N.BukkitValues."vestigium:key"=VALUE
#   npc_type         — set by TravelingNPCManager  (uppercase string constants)
#   special_npc_type — set by SpecialNPCManager     (uppercase string constants)
#
# Place each PNG in this same folder:
#   resourcepack/assets/minecraft/optifine/mob/villager/<filename>.png

textures=22

# ── Traveling NPCs (vestigium:npc_type) ──────────────────────────────────────

texture.1=npc_traveling_scholar.png
nbt.1.BukkitValues."vestigium:npc_type"=TRAVELING_SCHOLAR

