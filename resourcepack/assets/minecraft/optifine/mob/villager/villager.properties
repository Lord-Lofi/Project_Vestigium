# Vestigium NPC Custom Skins — Villager entities
# OptiFine Random Entities: matches on custom name, applies replacement texture.
# Non-matching villagers (natural, untouched) retain their vanilla textures.
#
# Texture format: 64×64 PNG, Villager UV layout.
# All NPCs are set to Villager.Profession.NONE in code — the unemployed profession
# overlay (a thin plain robe) will still render on top of this base texture.
# Options for artists:
#   A) Design skins that look intentional with the unemployed overlay visible.
#   B) Include a blank/transparent assets/minecraft/textures/entity/villager/profession/unemployed.png
#      in this resource pack to suppress the overlay entirely (affects all unemployed
#      villagers server-wide — acceptable on a controlled custom server).
#
# Place each PNG in this same folder:
#   resourcepack/assets/minecraft/optifine/mob/villager/<filename>.png

textures=22

