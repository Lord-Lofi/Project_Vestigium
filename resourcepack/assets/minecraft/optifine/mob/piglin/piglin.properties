# Vestigium Custom Skins — Piglin entities
# PDC keys:
#   vestigium:piglin_lord        — BastionPoliticsManager (any value = Overlord)
#   vestigium:nether_mob_variant — NetherMobManager (corrupted_piglin)
#
# Overlord checked first — lords take priority over corrupted variant.

textures=2

# Piglin Lords (Overlords): vestigium:piglin_lord holds a bastion key string
texture.1=mob_piglin_lord.png
nbt.1.BukkitValues."vestigium:piglin_lord"=*

texture.2=mob_corrupted_piglin.png
nbt.2.BukkitValues."vestigium:nether_mob_variant"=corrupted_piglin
