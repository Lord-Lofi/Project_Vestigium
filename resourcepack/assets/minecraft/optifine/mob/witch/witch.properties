# Vestigium Custom Skins — Witch entities
# PDC keys:
#   vestigium:fen_witch_variant — FenWitchManager (value: fen_witch)
#   vestigium:fen_witch_phase   — FenWitchManager (INTEGER: 1 = normal, 2 = enraged)
#
# Texture 1 (enraged) is checked first so it wins over texture 2 (normal).

textures=2

# Fen Witch enraged (phase 2) — checked first for priority
texture.1=mob_fen_witch_enraged.png
nbt.1.BukkitValues."vestigium:fen_witch_variant"=fen_witch
nbt.1.BukkitValues."vestigium:fen_witch_phase"=2

# Fen Witch normal (phase 1)
texture.2=mob_fen_witch.png
nbt.2.BukkitValues."vestigium:fen_witch_variant"=fen_witch
