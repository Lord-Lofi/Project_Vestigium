# Vestigium NPC Custom Skins — Zombie entities
# OptiFine Random Entities: matches on custom name, applies replacement texture.
# Non-matching zombies retain their vanilla texture.
#
# Texture format: 64×64 PNG, Zombie UV layout (identical to vanilla zombie texture layout).
#
# Place each PNG in this same folder:
#   resourcepack/assets/minecraft/optifine/mob/zombie/<filename>.png

textures=2

texture.1=npc_grave_robber.png
name.1=Grave Robber

texture.2=npc_hired_blade.png
name.2=Hired Blade
