# Vestigium Custom Skins — Zombie entities
# OptiFine Random Entities: matches on vestigium PDC tags (BukkitValues NBT).
# Non-matching zombies (vanilla) are unaffected.
#
# Texture format: 64×64 PNG, Zombie UV layout.
# Place each PNG in this same folder:
#   resourcepack/assets/minecraft/optifine/mob/zombie/<filename>.png
#
# PDC keys referenced:
#   vestigium:special_npc_type   — SpecialNPCManager (GRAVE_ROBBER)
#   vestigium:mercenary_owner    — TravelingNPCBehaviorManager (Hired Blade)
#   vestigium:echo_beast_variant — EchoBeastManager
#   vestigium:thornback_variant  — ThornbackManager
#   vestigium:mob_variant        — CustomHostileMobManager (ancient)
#   vestigium:player_minion_role — PlayerMinionManager (shade / scout)
#   vestigium:doppel_target      — DoppelgangerManager (any value = doppelganger)

textures=8

# NPC: Grave Robber (SpecialNPCManager)
texture.1=npc_grave_robber.png
nbt.1.BukkitValues."vestigium:special_npc_type"=GRAVE_ROBBER

# NPC: Hired Blade (TravelingNPCBehaviorManager mercenary escort)
texture.2=npc_hired_blade.png
nbt.2.BukkitValues."vestigium:mercenary_owner"=*

# Echo Beast (EchoBeastManager — deep underground zombie)
texture.3=mob_echo_beast.png
nbt.3.BukkitValues."vestigium:echo_beast_variant"=echo_beast

# Thornback (ThornbackManager — surface zombie, fires arrows on hit)
texture.4=mob_thornback.png
nbt.4.BukkitValues."vestigium:thornback_variant"=thornback

# Ancient Zombie (CustomHostileMobManager — rare glowing zombie)
texture.5=mob_ancient_zombie.png
nbt.5.BukkitValues."vestigium:mob_variant"=ancient

# Shade minion (PlayerMinionManager — invisible assassin zombie)
texture.6=mob_shade.png
nbt.6.BukkitValues."vestigium:player_minion_role"=shade

# Scout minion (PlayerMinionManager — patrol zombie)
texture.7=mob_scout.png
nbt.7.BukkitValues."vestigium:player_minion_role"=scout

# Doppelganger (DoppelgangerManager — impersonates offline player; name is dynamic)
texture.8=mob_doppelganger.png
nbt.8.BukkitValues."vestigium:doppel_target"=*
