name: VestigiumEconomy
version: '${project.version}'
main: com.vestigium.vestigiumeconomy.VestigiumEconomy
api-version: '1.21'
description: Vestige Shard currency, dynamic faction market, structure loot tables
authors: [ Lord-Lofi ]
load: POSTWORLD
depend:
  - VestigiumLib
softdepend:
  - Vault

commands:
  vecurrency:
    description: Manage Vestige Shard balances
    usage: /vecurrency <balance | give <player> <amount> | take <player> <amount> | check <player>>
    permission: vestigium.currency.use
    permission-message: §cYou do not have permission to use this command.

  vebuy:
    description: Purchase an item from the last market you visited
    usage: /vebuy <number>
    permission: vestigium.market.use
    permission-message: §cYou do not have permission to buy from markets.

  verunic:
    description: Runic Crafting — list runes, inspect gear, admin give/remove
    usage: /verunic <list | give <rune> [player] | inspect | remove <1|2>>

  veritual:
    description: Ritual Crafting — list recipes, manage stations, admin give
    usage: /veritual <recipes | station <set <id> | remove | list> | give <recipe> [player]>

  vealchemy:
    description: Alchemy Expansion — brew multi-ingredient flasks at Alembic stations
    usage: /vealchemy <recipes | brew <id> | station <give [player] | remove | list>>

permissions:
  vestigium.currency.use:
    description: Check your own Vestige Shard balance
    default: true

  vestigium.currency.admin:
    description: Give, take, and inspect Vestige Shard balances for any player
    default: op

  vestigium.market.use:
    description: Purchase items from Vestigium markets
    default: true

  vestigium.runic.admin:
    description: Give runes to players and remove runes from gear
    default: op

  vestigium.ritual.admin:
    description: Manage ritual stations and give ritual items to players
    default: op

  vestigium.alchemy.admin:
    description: Register alchemy stations and give station designator items
    default: op
