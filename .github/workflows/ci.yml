# Builds every Project Vestigium plugin on each pull request and push to main
# or develop. The job name "check" is the required status check in the
# "main – review" ruleset.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21 (Paper 1.21 needs Java 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Compiles all modules in dependency order (VestigiumLib first) and
      # packages each plugin jar.
      - name: Build all plugins
        run: mvn -B -ntp verify

      # Build output and IDE files are gitignored; make sure none slip in
      # (they can contain local paths such as your Windows user folder).
      - name: Check no build output is committed
        run: |
          found=$(git ls-files '*/target/*' '*.jar' '*.class' '.idea/*' '*.iml' | head -20)
          if [ -n "$found" ]; then
            echo "::error::Build output or IDE files are committed: $found"
            exit 1
          fi

      - name: Upload the plugin jars
        uses: actions/upload-artifact@v7
        with:
          name: vestigium-plugins
          path: |
            */target/*.jar
            !*/target/original-*.jar
          retention-days: 14
